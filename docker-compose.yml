services:
  web:
    image: nginx:alpine
    restart: always
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.elections.rule=Host(`liste-fo-aveyron-labo-2026.fun`) || Host(`www.liste-fo-aveyron-labo-2026.fun`)
      - traefik.http.routers.elections.entrypoints=websecure
      - traefik.http.routers.elections.tls=true
      - traefik.http.routers.elections.tls.certresolver=mytlschallenge
      - traefik.http.services.elections.loadbalancer.server.port=80
      - traefik.http.middlewares.elections-secure.headers.contentTypeNosniff=true
      - traefik.http.middlewares.elections-secure.headers.frameDeny=true
      - traefik.http.middlewares.elections-secure.headers.browserXssFilter=true
      - traefik.http.middlewares.elections-secure.headers.stsSeconds=31536000
      - traefik.http.middlewares.elections-secure.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.elections-secure.headers.referrerPolicy=no-referrer
      - "traefik.http.middlewares.elections-secure.headers.contentSecurityPolicy=default-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - traefik.http.middlewares.elections-ratelimit.ratelimit.average=30
      - traefik.http.middlewares.elections-ratelimit.ratelimit.period=1s
      - traefik.http.middlewares.elections-ratelimit.ratelimit.burst=60
      - traefik.http.routers.elections.middlewares=elections-secure@docker,elections-ratelimit@docker

networks:
  web:
    external: true
    name: root_default
