# Déploiement du site vitrine sur le VPS.
# Entrée : push sur la branche master.
# Sortie : git pull dans /root/elections-cse. Les pages sont servies depuis ce dossier.
name: Mettre le site en ligne

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Mettre à jour le dossier sur le VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null; then
            echo "La clé VPS_SSH_KEY est illisible. Ouvre le secret GitHub et recolle-la, de BEGIN à END, avec ses retours à la ligne."
            exit 1
          fi
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "cd /root/elections-cse && git pull --ff-only"
