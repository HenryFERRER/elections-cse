# Déploiement du site vitrine sur le VPS.
# Entrée : push sur la branche master.
# Sortie : git pull dans /root/elections-cse. Les pages sont servies depuis ce dossier.
name: Mettre le site en ligne

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Mettre à jour le dossier sur le VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          cleaned=$(printf '%s' "$SSH_KEY" | tr -d '\r')
          if printf '%s\n' "$cleaned" | grep -q "BEGIN OPENSSH PRIVATE KEY"; then
            printf '%s\n' "$cleaned" > ~/.ssh/deploy_key
          else
            printf '%s' "$cleaned" | tr -d ' \n' | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null; then
            echo "La clé VPS_SSH_KEY est illisible. Ouvre le secret GitHub et recolle-la, de BEGIN à END, avec ses retours à la ligne."
            exit 1
          fi
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "sudo -n git -C /root/elections-cse pull --ff-only"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "mkdir -p ~/.ssh && chmod 700 ~/.ssh && touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys && grep -q cseforus-deploy ~/.ssh/authorized_keys || echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMow5+3o7Crre4xpwtYFMeYrHAao8DaqohLuW67i6Q+E cseforus-deploy' >> ~/.ssh/authorized_keys"
